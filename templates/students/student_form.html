{% extends "base/base.html" %}

{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}إدخال وتحديث بيانات الطالب الأساسية{% endblock %}

{% block content %}
<div class="opal-card p-4">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">حفظ</button>
            <a href="{% url 'students:student_list' %}" class="btn btn-secondary">رجوع</a>
        </div>
    </form>
</div>
{% endblock %}
