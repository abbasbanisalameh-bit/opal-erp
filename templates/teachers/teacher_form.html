{% extends "base/base.html" %}{% block title %}{{ title }}{% endblock %}{% block content %}<div class="d-flex justify-content-between mb-4"><h2>{{ title }}</h2><a class="btn btn-outline-secondary" href="{% url 'teachers:teacher_list' %}">رجوع</a></div><div class="opal-card p-4"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6 {% if field.name == 'address' %}col-12{% endif %}"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><button class="btn btn-primary mt-4">حفظ</button></form></div>{% endblock %}
