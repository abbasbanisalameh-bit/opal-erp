{% extends "base/base.html" %}

{% block title %}تعديل الحضور{% endblock %}
{% block page_title %}تعديل الحضور{% endblock %}
{% block page_subtitle %}تعديل حالة حضور الطالب وملاحظاته{% endblock %}

{% block content %}

<div class="opal-card">

<h3 class="fw-bold mb-4">{{ record.student.full_name }}</h3>

<form method="post">
{% csrf_token %}

<label class="form-label fw-bold">الحالة</label><select class="form-select mb-3" name="status">
<option value="present" {% if record.status == "present" %}selected{% endif %}>حاضر</option>
<option value="absent" {% if record.status == "absent" %}selected{% endif %}>غائب</option>
<option value="late" {% if record.status == "late" %}selected{% endif %}>متأخر</option>
<option value="excused" {% if record.status == "excused" %}selected{% endif %}>بعذر</option>
</select>

<label class="form-label fw-bold">الملاحظات</label><textarea class="form-control mb-3" rows="4" name="notes">{{ record.notes }}</textarea>

<button class="btn btn-primary"><i class="bi bi-check2-circle"></i> حفظ التعديلات</button>

</form>

</div>

{% endblock %}
