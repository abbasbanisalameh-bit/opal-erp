{% extends "base/base.html" %}
{% block title %}{{ title }} | OPAL ERP{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="opal-card"><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label fw-bold">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><button class="btn btn-primary mt-4">حفظ</button><a href="{% url 'core:branch_list' %}" class="btn btn-secondary mt-4">رجوع</a></form></div>{% endblock %}
