<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ error_title }} | OPAL ERP</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font-family:Tahoma,Arial,sans-serif}
        main{width:min(92%,620px);background:#fff;border:1px solid #dce4ef;border-radius:18px;padding:38px;box-shadow:0 16px 45px rgba(20,35,60,.08);text-align:center}
        .code{font-size:64px;font-weight:800;color:#173b6c;line-height:1}
        h1{font-size:26px;margin:18px 0 10px}p{color:#5c687b;line-height:1.9}
        a{display:inline-block;margin-top:16px;background:#173b6c;color:#fff;text-decoration:none;padding:11px 22px;border-radius:10px}
    </style>
</head>
<body>
<main>
    <div class="code">{{ status_code }}</div>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
</main>
</body>
</html>
