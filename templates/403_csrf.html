<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <title>تحديث الصفحة | OPAL ERP</title>
    <style>
        *{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#020617,#071427 55%,#0f172a);color:#fff}
        .card{width:min(100%,520px);padding:34px 28px;border:1px solid rgba(94,234,212,.2);border-radius:28px;background:rgba(15,23,42,.95);box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
        .icon{font-size:46px}.card h1{margin:14px 0 10px;font-size:26px}.card p{color:#cbd5e1;line-height:1.8}
        .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
        .btn{display:inline-block;padding:12px 20px;border-radius:14px;text-decoration:none;font-weight:800;border:0;cursor:pointer}
        .primary{background:linear-gradient(90deg,#5eead4,#22d3ee);color:#04111f}.secondary{background:#1e293b;color:#fff}
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">🔄</div>
        <h1>انتهت صلاحية الصفحة</h1>
        <p>لحماية حسابك لم ينفّذ النظام الطلب. حدّث الصفحة ثم أعد المحاولة، ولن تُفقد أي بيانات محفوظة سابقًا.</p>
        <div class="actions">
            <button class="btn primary" type="button" onclick="window.location.reload()">تحديث الصفحة</button>
            <a class="btn secondary" href="{{ login_url }}">العودة إلى الدخول</a>
        </div>
    </main>
</body>
</html>
