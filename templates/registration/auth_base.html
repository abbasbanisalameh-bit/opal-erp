{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}حساب أوبال{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/opal_erp.css' %}?v=20260719-unified-glass" rel="stylesheet">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:radial-gradient(circle at 80% 10%,rgba(218,165,32,.16),transparent 30%),linear-gradient(135deg,#071427,#102542);font-family:Tahoma,Arial,sans-serif}
    .opal-auth-shell{width:min(100%,520px);padding:1.4rem;border:1px solid rgba(218,165,32,.35);border-radius:26px;background:rgba(255,255,255,.92);box-shadow:0 28px 80px rgba(0,0,0,.28);backdrop-filter:blur(22px)}
    .opal-auth-mark{width:62px;height:62px;display:grid;place-items:center;margin:0 auto .8rem;border-radius:20px;background:linear-gradient(135deg,#12304f,#087b70);color:#f2cf64;font-size:1.8rem}
    .opal-auth-shell h1{font-size:1.45rem;font-weight:900;text-align:center;color:#142746}.opal-auth-shell>p{text-align:center;color:#667085}
    .opal-auth-shell label{font-weight:800;margin-bottom:.35rem}.opal-auth-shell input{width:100%;border:1px solid rgba(20,39,70,.18);border-radius:13px;padding:.72rem .85rem;background:#fff}
    .opal-auth-shell ul.errorlist{color:#b42318;font-size:.84rem;margin:.4rem 0}.opal-auth-actions{display:flex;gap:.65rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem}
  </style>
</head>
<body>
  <main class="opal-auth-shell">
    <div class="opal-auth-mark"><i class="bi bi-gem"></i></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
