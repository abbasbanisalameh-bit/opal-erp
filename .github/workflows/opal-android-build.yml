name: OPAL Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/opal_learning_app/**'
      - '.github/workflows/opal-android-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPAL_API_BASE_URL: ${{ vars.OPAL_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android scaffold
        working-directory: mobile/opal_learning_app
        run: bash tool/prepare_android.sh

      - name: Flutter packages
        working-directory: mobile/opal_learning_app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/opal_learning_app
        run: flutter analyze

      - name: Test
        working-directory: mobile/opal_learning_app
        run: flutter test

      - name: Build APK and AAB
        working-directory: mobile/opal_learning_app
        shell: bash
        run: |
          API="${OPAL_API_BASE_URL:-https://opalschool2016.pythonanywhere.com/learning/api/v1}"
          flutter build apk --release --dart-define="OPAL_API_BASE_URL=$API"
          flutter build appbundle --release --dart-define="OPAL_API_BASE_URL=$API"
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab > build/android-release-sha256.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opal-android-release
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/opal_learning_app/build/app/outputs/flutter-apk/app-release.apk
            mobile/opal_learning_app/build/app/outputs/bundle/release/app-release.aab
            mobile/opal_learning_app/build/android-release-sha256.txt
